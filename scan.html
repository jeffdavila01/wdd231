
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Barcode Product Scanner</title>

  <!-- CSS -->
  <link rel="stylesheet" href="scan.css">

  <!-- Barcode Scanner Library -->
  <script
    src="https://unpkg.com/html5-qrcode"
    defer>
  </script>

  <!-- Our JavaScript -->
  <script src="scan.js" defer></script>
</head>

<body>

  <main class="container">

    <h1>📦 Barcode Scanner</h1>


    <!-- =========================
         MODE BUTTONS
    ========================== -->

    <div class="mode-buttons">

      <button
        type="button"
        id="addModeBtn"
        class="active"
      >
        Add Product
      </button>


      <button
        type="button"
        id="scanModeBtn"
        class="inactive"
      >
        Scan Product
      </button>

    </div>


    <!-- =========================
         CAMERA BUTTONS
    ========================== -->

    <div class="camera-buttons">

      <button
        type="button"
        id="startCamera"
      >
        📷 Start Camera
      </button>


      <button
        type="button"
        id="stopCamera"
      >
        Stop Camera
      </button>

    </div>


    <!-- =========================
         CAMERA
    ========================== -->

    <div id="reader"></div>


    <!-- =========================
         STATUS
    ========================== -->

    <p
      class="status"
      id="status"
      aria-live="polite"
    >
      Add Product Mode
    </p>


    <!-- =========================
         ADD PRODUCT
    ========================== -->

    <section
      id="addSection"
      class="section"
    >

      <h2>Add Product</h2>


      <label for="barcodeInput">
        Barcode Number
      </label>

      <input
        type="text"
        id="barcodeInput"
        placeholder="Scan barcode or type number"
        inputmode="numeric"
        autocomplete="off"
      >


      <label for="productName">
        Product Name
      </label>

      <input
        type="text"
        id="productName"
        placeholder="Example: Coca-Cola"
        autocomplete="off"
      >


      <label for="productPrice">
        Price
      </label>

      <input
        type="number"
        id="productPrice"
        placeholder="Example: 35"
        min="0"
        step="0.01"
      >


      <button
        type="button"
        class="save-btn"
        id="saveProduct"
      >
        💾 Save Product
      </button>

    </section>


    <!-- =========================
         SCAN PRODUCT
    ========================== -->

    <section
      id="scanSection"
      class="section hidden"
    >

      <h2>Scan Product</h2>


      <label for="searchBarcode">
        Barcode Number
      </label>

      <input
        type="text"
        id="searchBarcode"
        placeholder="Scan barcode or type number"
        inputmode="numeric"
        autocomplete="off"
      >


      <button
        type="button"
        class="search-btn"
        id="searchProduct"
      >
        🔍 Find Product
      </button>


      <!-- PRODUCT RESULT -->

      <div
        class="result"
        id="result"
      >

        <h2 id="resultName"></h2>


        <p>
          Barcode:
          <span id="resultBarcode"></span>
        </p>


        <p class="price">
          ₱<span id="resultPrice"></span>
        </p>

      </div>

    </section>


    <!-- =========================
         SAVED PRODUCTS
    ========================== -->

    <section class="products">

      <h2>Saved Products</h2>

      <div id="productList">
        <!-- JavaScript adds products here -->
      </div>

    </section>

  </main>

</body>

</html>
