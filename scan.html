<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Product Scanner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .mode-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .active {
      background: #007bff;
      color: white;
    }

    .inactive {
      background: #ddd;
      color: #222;
    }

    #reader {
      width: 100%;
      margin-bottom: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .section {
      margin-top: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    .save-btn,
    .search-btn {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      background: #28a745;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .search-btn {
      background: #007bff;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #eef7ff;
      border-radius: 10px;
      display: none;
    }

    .result h2 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      color: #198754;
    }

    .status {
      margin: 15px 0;
      text-align: center;
      font-weight: bold;
    }

    .products {
      margin-top: 30px;
    }

    .product-item {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .product-item button {
      margin-top: 7px;
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .camera-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .camera-buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    #startCamera {
      background: #222;
      color: white;
    }

    #stopCamera {
      background: #ddd;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📦 Barcode Scanner</h1>

  <div class="mode-buttons">
    <button id="addModeBtn" class="active">
      Add Product
    </button>

    <button id="scanModeBtn" class="inactive">
      Scan Product
    </button>
  </div>


  <div class="camera-buttons">
    <button id="startCamera">📷 Start Camera</button>
    <button id="stopCamera">Stop Camera</button>
  </div>


  <div id="reader"></div>


  <p class="status" id="status">
    Add Product Mode
  </p>


  <!-- ADD PRODUCT -->

  <div id="addSection" class="section">

    <label>Barcode Number</label>

    <input
      type="text"
      id="barcodeInput"
      placeholder="Scan barcode or type number"
    >


    <label>Product Name</label>

    <input
      type="text"
      id="productName"
      placeholder="Example: Coca-Cola"
    >


    <label>Price</label>

    <input
      type="number"
      id="productPrice"
      placeholder="Example: 35"
      step="0.01"
    >


    <button class="save-btn" id="saveProduct">
      Save Product
    </button>

  </div>


  <!-- SCAN PRODUCT -->

  <div id="scanSection" class="section hidden">

    <label>Barcode Number</label>

    <input
      type="text"
      id="searchBarcode"
      placeholder="Scan barcode or type number"
    >

    <button class="search-btn" id="searchProduct">
      Find Product
    </button>


    <div class="result" id="result">

      <h2 id="resultName"></h2>

      <p>
        Barcode:
        <span id="resultBarcode"></span>
      </p>

      <br>

      <p class="price">
        ₱<span id="resultPrice"></span>
      </p>

    </div>

  </div>


  <!-- SAVED PRODUCTS -->

  <div class="products">

    <h2>Saved Products</h2>

    <div id="productList"></div>

  </div>

</div>


<!-- Barcode Scanner Library -->

<script src="https://unpkg.com/html5-qrcode"></script>


<script>

let currentMode = "add";

let scanner = null;

let lastScannedCode = "";

let lastScanTime = 0;


/* ==============================
   GET PRODUCTS
================================ */

function getProducts() {

  return JSON.parse(
    localStorage.getItem("products")
  ) || {};

}


/* ==============================
   SAVE PRODUCTS
================================ */

function saveProducts(products) {

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

}


/* ==============================
   SWITCH TO ADD MODE
================================ */

document
.getElementById("addModeBtn")
.addEventListener("click", function () {

  currentMode = "add";

  document
  .getElementById("addSection")
  .classList.remove("hidden");

  document
  .getElementById("scanSection")
  .classList.add("hidden");


  this.className = "active";

  document
  .getElementById("scanModeBtn")
  .className = "inactive";


  document
  .getElementById("status")
  .textContent = "Add Product Mode";

});


/* ==============================
   SWITCH TO SCAN MODE
================================ */

document
.getElementById("scanModeBtn")
.addEventListener("click", function () {

  currentMode = "scan";

  document
  .getElementById("scanSection")
  .classList.remove("hidden");

  document
  .getElementById("addSection")
  .classList.add("hidden");


  this.className = "active";

  document
  .getElementById("addModeBtn")
  .className = "inactive";


  document
  .getElementById("status")
  .textContent = "Scan Product Mode";

});


/* ==============================
   SAVE PRODUCT
================================ */

document
.getElementById("saveProduct")
.addEventListener("click", function () {

  const barcode =
    document
    .getElementById("barcodeInput")
    .value
    .trim();


  const name =
    document
    .getElementById("productName")
    .value
    .trim();


  const price =
    document
    .getElementById("productPrice")
    .value
    .trim();


  if (!barcode || !name || !price) {

    alert(
      "Please enter barcode, product name and price."
    );

    return;

  }


  const products = getProducts();


  products[barcode] = {

    barcode: barcode,

    name: name,

    price: Number(price)

  };


  saveProducts(products);


  alert("Product saved successfully!");


  document
  .getElementById("barcodeInput")
  .value = "";


  document
  .getElementById("productName")
  .value = "";


  document
  .getElementById("productPrice")
  .value = "";


  displayProducts();

});


/* ==============================
   FIND PRODUCT
================================ */

function findProduct(barcode) {

  const products = getProducts();

  const product = products[barcode];


  const result =
    document.getElementById("result");


  if (product) {

    document
    .getElementById("resultName")
    .textContent = product.name;


    document
    .getElementById("resultBarcode")
    .textContent = product.barcode;


    document
    .getElementById("resultPrice")
    .textContent =
      Number(product.price).toFixed(2);


    result.style.display = "block";


    document
    .getElementById("status")
    .textContent =
    "✅ Product Found";

  }

  else {

    result.style.display = "none";


    document
    .getElementById("status")
    .textContent =
    "❌ Product not found";

  }

}


/* ==============================
   MANUAL SEARCH
================================ */

document
.getElementById("searchProduct")
.addEventListener("click", function () {

  const barcode =
    document
    .getElementById("searchBarcode")
    .value
    .trim();


  if (!barcode) {

    alert("Enter or scan a barcode.");

    return;

  }


  findProduct(barcode);

});


/* ==============================
   WHEN BARCODE SCANNED
================================ */

function onScanSuccess(decodedText) {

  const now = Date.now();


  /*
  Prevent same barcode from
  scanning repeatedly very fast
  */

  if (
    decodedText === lastScannedCode &&
    now - lastScanTime < 2000
  ) {

    return;

  }


  lastScannedCode = decodedText;

  lastScanTime = now;


  if (currentMode === "add") {

    document
    .getElementById("barcodeInput")
    .value = decodedText;


    document
    .getElementById("status")
    .textContent =
    "Barcode scanned: " + decodedText;

  }

  else {

    document
    .getElementById("searchBarcode")
    .value = decodedText;


    findProduct(decodedText);

  }

}


/* ==============================
   START CAMERA
================================ */

document
.getElementById("startCamera")
.addEventListener("click", async function () {

  if (scanner) {

    return;

  }


  scanner =
    new Html5Qrcode("reader");


  try {

    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      alert("No camera found.");

      scanner = null;

      return;

    }


    /*
    Usually last camera is
    back camera on phones
    */

    let cameraId =
      cameras[cameras.length - 1].id;


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {

          width: 280,

          height: 160

        }

      },

      onScanSuccess,

      function(errorMessage) {

        /*
        Scanner keeps checking.
        Ignore normal scan errors.
        */

      }

    );


    document
    .getElementById("status")
    .textContent =
    "📷 Camera running. Point it at a barcode.";


  }

  catch (error) {

    console.error(error);


    alert(
      "Camera could not start. Make sure camera permission is allowed and the website is using HTTPS."
    );


    scanner = null;

  }

});


/* ==============================
   STOP CAMERA
================================ */

document
.getElementById("stopCamera")
.addEventListener("click", async function () {

  if (!scanner) {

    return;

  }


  try {

    await scanner.stop();

    await scanner.clear();

  }

  catch (error) {

    console.log(error);

  }


  scanner = null;


  document
  .getElementById("status")
  .textContent =
  "Camera stopped.";

});


/* ==============================
   SHOW SAVED PRODUCTS
================================ */

function displayProducts() {

  const products =
    getProducts();


  const productList =
    document
    .getElementById("productList");


  productList.innerHTML = "";


  const productArray =
    Object.values(products);


  if (productArray.length === 0) {

    productList.innerHTML =
    "<p>No products saved yet.</p>";

    return;

  }


  productArray.forEach(function(product) {

    const div =
      document.createElement("div");


    div.className =
      "product-item";


    div.innerHTML = `

      <strong>
        ${escapeHTML(product.name)}
      </strong>

      <br>

      Barcode:
      ${escapeHTML(product.barcode)}

      <br>

      Price:
      ₱${Number(product.price).toFixed(2)}

      <br>

      <button
        data-barcode="${escapeHTML(product.barcode)}"
        class="delete-btn"
      >
        Delete
      </button>

    `;


    productList.appendChild(div);

  });


  document
  .querySelectorAll(".delete-btn")
  .forEach(function(button) {

    button.addEventListener(
      "click",
      function () {

        const barcode =
          this.dataset.barcode;


        const products =
          getProducts();


        delete products[barcode];


        saveProducts(products);


        displayProducts();

      }
    );

  });

}


/* ==============================
   BASIC HTML SAFETY
================================ */

function escapeHTML(text) {

  return String(text)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


/* ==============================
   INITIAL LOAD
================================ */

displayProducts();

</script>

</body>
</html>
